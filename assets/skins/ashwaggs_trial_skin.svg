  <!-- Player Head -->
  <rect x="24" y="0" width="16" height="16" fill="#8B4513" />
  <rect x="24" y="16" width="16" height="16" fill="#8B4513" />
  <rect x="24" y="32" width="16" height="16" fill="#8B4513" />
